<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e15">
  <meta name="description" content="Rag Showdown - a 1v1 ragdoll fighting game. 16 stickman fighters with anime-style powers, cinematic supers with impact-frame finishers, a 48-level campaign, Versus, Survival and Training.">
  <title>Rag Showdown</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <canvas id="stage" aria-label="Game"></canvas>

  <!-- =============================== HUD =============================== -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hs p1" id="hs0"><div class="pt"><img alt=""></div><div class="col"><div class="nm"><b></b><small></small><span class="wins"></span></div><div class="hp"><i class="lag"></i><i class="fill"></i></div><div class="gd"><i></i></div></div></div>
      <div class="timer" id="timer"><b>99</b><small>ROUND 1</small><span class="dots" id="waveDots"></span></div>
      <div class="hs p2" id="hs1"><div class="pt"><img alt=""></div><div class="col"><div class="nm"><b></b><small></small><span class="wins"></span></div><div class="hp"><i class="lag"></i><i class="fill"></i></div><div class="gd"><i></i></div></div></div>
    </div>
    <div class="hud-chip hidden" id="hudChip"></div>
    <div class="hud-right"><button class="round" id="btnPause" aria-label="Pause"><span class="ic" data-icon="pause"></span></button></div>
    <div class="combo-pop p1 hidden" id="combo0"><b>0</b><span>HITS</span></div>
    <div class="combo-pop p2 hidden" id="combo1"><b>0</b><span>HITS</span></div>
    <div class="sm p1" id="sm0"><b>SUPER</b><div class="trk"><i></i></div></div>
    <div class="sm p2" id="sm1"><b>SUPER</b><div class="trk"><i></i></div></div>
    <div class="skillbar" id="skillbar"></div>
    <div class="coach hidden" id="coach"><p id="coachText"></p></div>
    <div class="tut hidden" id="tut">
      <div class="tut-dots" id="tutDots"></div>
      <div class="tut-vis" id="tutVis"></div>
      <div class="tut-label"><b id="tutText">MOVE</b><span id="tutCount"></span></div>
      <p class="tut-hint" id="tutHint"></p>
      <button class="tut-skip" id="tutSkip">SKIP<span class="ic" data-icon="next"></span></button>
    </div>
    <div class="tpad" id="tpad">
      <div class="joy" id="joy"><div class="joy-base"></div><div class="joy-knob" id="joyKnob"></div></div>
      <div class="orbs" id="orbs"></div>
    </div>
  </div>

  <!-- =============================== HOME =============================== -->
  <section id="home" class="screen">
    <div class="home-panel">
      <h1 class="title" aria-label="Rag Showdown"><span class="t1" aria-hidden="true"><i style="--i:0">R</i><i style="--i:1">A</i><i style="--i:2">G</i></span><span class="t2" aria-hidden="true"><i>SHOWDOWN</i></span><span class="tag">ANIME RAGDOLL FIGHTER</span></h1>
      <div class="home-menu">
        <button class="btn primary big" id="btnPlay"><span class="ic" data-icon="play"></span><span class="bt"><b>PLAY</b><small id="playSub">LEVEL 1-1</small></span></button>
        <div class="btn-row">
          <button class="btn mode" id="btnVersus"><span class="ic" data-icon="swords"></span><span class="bt"><b>VERSUS</b><small>CPU OR 2 PLAYERS</small></span></button>
          <button class="btn mode" id="btnSurvival"><span class="ic" data-icon="infinity"></span><span class="bt"><b>SURVIVAL</b><small id="survSub">BEST 0</small></span></button>
        </div>
        <div class="btn-row">
          <button class="btn tile" id="btnLevels"><span class="ic" data-icon="map"></span><b>LEVELS</b></button>
          <button class="btn tile" id="btnRoster"><span class="ic" data-icon="user"></span><b>FIGHTERS</b><i class="note hidden" id="rosterNote"></i></button>
          <button class="btn tile" id="btnTraining"><span class="ic" data-icon="target"></span><b>TRAINING</b></button>
        </div>
      </div>
      <div class="pick-card" id="homePick"></div>
      <div class="daily" id="daily"></div>
    </div>
    <div class="corner tr">
      <div class="pill stars"><span class="ic star" data-icon="star"></span><b id="homeStars">0</b></div>
      <div class="pill"><span class="ic coin" data-icon="coins"></span><b class="coin-val">0</b></div>
      <button class="round" id="btnHow" aria-label="How to play"><span class="ic" data-icon="book"></span></button>
      <button class="round" id="btnSettings" aria-label="Settings"><span class="ic" data-icon="gear"></span></button>
    </div>
  </section>

  <!-- ============================== LEVELS ============================== -->
  <section id="levels" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <nav class="seg" id="chapterTabs"></nav>
      <div class="pill stars"><span class="ic star" data-icon="star"></span><b id="levelStars">0</b></div>
    </header>
    <div class="realm-head" id="chapterHead"></div>
    <div class="stage-grid six" id="levelGrid"></div>
    <div class="lv-foot" id="levelFoot"></div>
  </section>

  <!-- ============================== SELECT ============================== -->
  <section id="select" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <h2 id="selTitle">CHOOSE YOUR FIGHTER</h2>
      <div class="pill"><span class="ic coin" data-icon="coins"></span><b class="coin-val">0</b></div>
    </header>
    <div class="sel">
      <div class="sel-grid card" id="selGrid"></div>
      <div class="sel-detail card" id="selDetail"></div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toasts"></div>
  <div id="bars" aria-hidden="true"><i style="--i:4"></i><i style="--i:3"></i><i style="--i:5"></i><i style="--i:2"></i><i style="--i:6"></i><i style="--i:1"></i><i style="--i:7"></i><i style="--i:0"></i><i style="--i:8"></i></div>
  <div id="rotate" class="hidden"><div><span class="ic" data-icon="rotate"></span><p>TURN YOUR DEVICE SIDEWAYS</p><button class="btn primary" id="btnRotateOk"><b>PLAY ANYWAY</b></button></div></div>

  <script src="js/util.js?v=4"></script>
  <script src="js/icons.js?v=4"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/rag.js?v=4"></script>
  <script src="js/fx.js?v=4"></script>
  <script src="js/fighters.js?v=4"></script>
  <script src="js/save.js?v=4"></script>
  <script src="js/campaign.js?v=4"></script>
  <script src="js/stage.js?v=4"></script>
  <script src="js/input.js?v=4"></script>
  <script src="js/ai.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
  <script src="js/ui.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
